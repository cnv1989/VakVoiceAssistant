# Deploys the Vak CDK stacks (network, app, monitoring).
#
# Required repo secret:  AWS_ROLE_ARN          — OIDC role for GitHub Actions
# Optional repo secrets: DEEPGRAM_API_KEY_SECRET_ARN, TWILIO_AUTH_TOKEN_SECRET_ARN
# Optional repo variables: AWS_REGION, DOMAIN_NAME, HOSTED_ZONE_DOMAIN, BUSINESS_NAME, BUSINESS_VERTICAL
#
# Bootstrap CDK once per account/region before the first deploy:
#   cd VakInfra && npx cdk bootstrap
name: Deploy VakInfra

on:
  push:
    branches: [main]
    paths:
      - 'VakInfra/**'
      - '.github/workflows/deploy-vak-infra.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-vak-infra-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
    defaults:
      run:
        working-directory: VakInfra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          DEEPGRAM_API_KEY_SECRET_ARN: ${{ secrets.DEEPGRAM_API_KEY_SECRET_ARN }}
          TWILIO_AUTH_TOKEN_SECRET_ARN: ${{ secrets.TWILIO_AUTH_TOKEN_SECRET_ARN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_DOMAIN: ${{ vars.HOSTED_ZONE_DOMAIN }}
          BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          BUSINESS_VERTICAL: ${{ vars.BUSINESS_VERTICAL }}
        run: npx cdk deploy --all --require-approval never
