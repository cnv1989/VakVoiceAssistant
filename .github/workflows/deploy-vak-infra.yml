# Deploys per-stage VakInfra CDK stacks.
# Shared stacks (VakDnsStack, VakNetworkStack) are deployed only from prod/main.
# Required repo secret: AWS_ROLE_ARN (OIDC role for GitHub Actions).
# Bootstrap CDK once per account/region: cdk bootstrap aws://844341423871/us-west-2
name: Deploy VakInfra

on:
  push:
    branches: [alpha, beta, prod, main]
    paths:
      - 'VakInfra/**'
      - '.github/workflows/deploy-vak-infra.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (alpha/beta/prod)'
        required: false
        default: ''

concurrency:
  group: deploy-vak-infra-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
    defaults:
      run:
        working-directory: VakInfra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stage from branch
        id: stage
        run: |
          INPUT="${{ github.event.inputs.stage }}"
          BRANCH="${{ github.ref_name }}"
          RAW="${INPUT:-$BRANCH}"
          case "$RAW" in
            alpha) STAGE=alpha; SUFFIX=Alpha ;;
            beta)  STAGE=beta;  SUFFIX=Beta  ;;
            prod|main) STAGE=prod; SUFFIX=Prod ;;
            *) echo "Unknown branch/stage '$RAW'"; exit 1 ;;
          esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Deploying stage: $STAGE ($SUFFIX)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Shared stacks only deployed from prod/main to avoid duplicate creates.
      # On first run for a new environment, deploy shared stacks manually:
      #   cd VakInfra && npx cdk deploy VakDnsStack VakNetworkStack --require-approval never
      - name: Deploy shared stacks (prod/main only)
        if: steps.stage.outputs.stage == 'prod'
        run: |
          npx cdk deploy VakDnsStack VakNetworkStack --require-approval never

      - name: Deploy stage-specific stacks
        env:
          SUFFIX: ${{ steps.stage.outputs.suffix }}
        run: |
          npx cdk deploy \
            "VakAppStack-${SUFFIX}" \
            "VakMonitoringStack-${SUFFIX}" \
            --require-approval never
