# Deploys VakNetworkStack and VakAppStack via AWS CDK.
# Required repo secret: AWS_ROLE_ARN (OIDC role for GitHub Actions).
# Bootstrap CDK once per account/region: cdk bootstrap aws://ACCOUNT_ID/us-west-2
name: Deploy VakInfra

on:
  push:
    branches: [main]
    paths:
      - 'VakInfra/**'
      - '.github/workflows/deploy-vak-infra.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vak-infra
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
    defaults:
      run:
        working-directory: VakInfra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure AWS credentials (Access keys)
        if: ${{ secrets.AWS_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate AWS credentials configuration
        if: ${{ secrets.AWS_ROLE_ARN == '' && (secrets.AWS_ACCESS_KEY_ID == '' || secrets.AWS_SECRET_ACCESS_KEY == '') }}
        run: |
          echo "Missing AWS credentials. Set AWS_ROLE_ARN for OIDC, or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for long-lived credentials."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: CDK deploy
        run: npx cdk deploy --all --require-approval never
