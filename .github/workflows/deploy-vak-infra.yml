# Deploys VakNetworkStack and VakAppStack via AWS CDK.
# Required repo secret: AWS_ROLE_ARN (OIDC role for GitHub Actions).
# Bootstrap CDK once per account/region: cdk bootstrap aws://ACCOUNT_ID/us-west-2
name: Deploy VakInfra

on:
  push:
    branches: [main]
    paths:
      - 'VakInfra/**'
      - '.github/workflows/deploy-vak-infra.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vak-infra
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
    defaults:
      run:
        working-directory: VakInfra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: CDK deploy
        run: npx cdk deploy --all --require-approval never
