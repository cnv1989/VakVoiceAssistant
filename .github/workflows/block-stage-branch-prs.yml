# Stage branches are updated only via promote.yml after merges to main.
# GitHub branch protection API is unavailable on private repos without Team/Pro;
# this workflow enforces the same policy for pull requests.

name: Block PRs to stage branches

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]
    branches: [alpha, beta, prod]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Pull requests targeting `alpha`, `beta`, or `prod` are not accepted.',
              'Merge to `main` instead; the **Promote** workflow updates stage branches.',
            ].join('\n\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
