name: Promote

# CI/CD promotion pipeline: main → alpha → beta → prod (all auto, single job)
#
# On every push to main: fast-forward alpha, beta, and prod in sequence
# then dispatch ECS deploys for all three stages.
#
# Single job avoids GITHUB_TOKEN cascade limitation (bot pushes don't
# re-trigger workflows, so we do the full chain here instead of chaining).

on:
  push:
    branches: [main]

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote main → alpha → beta → prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin alpha beta prod

          git checkout alpha
          git merge --ff-only origin/main
          git push origin alpha
          echo "✅ Promoted main → alpha"

          git checkout beta
          git merge --ff-only origin/alpha
          git push origin beta
          echo "✅ Promoted alpha → beta"

          git checkout prod
          git merge --ff-only origin/beta
          git push origin prod
          echo "✅ Promoted beta → prod"

          gh workflow run deploy-vakdeepgram.yml --ref alpha --field stage=alpha
          gh workflow run deploy-vakdeepgram.yml --ref beta  --field stage=beta
          gh workflow run deploy-vakdeepgram.yml --ref prod  --field stage=prod
          echo "✅ Dispatched deploys for alpha, beta, prod"
