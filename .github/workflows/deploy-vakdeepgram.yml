name: Deploy VakDeepGram

on:
  push:
    branches: [main]
    paths:
      - 'VakDeepGram/**'
      - '.github/workflows/deploy-vakdeepgram.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-vakdeepgram-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      ECR_REPO_NAME: ${{ vars.ECR_REPOSITORY_NAME || 'vak-deepgram' }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG || 'latest' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'vak-cluster-production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: VakDeepGram
        run: |
          docker build --platform linux/amd64 -t "${ECR_REPO_NAME}:${IMAGE_TAG}" .
          docker tag "${ECR_REPO_NAME}:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}"

      - name: Force ECS deployment
        run: |
          SERVICE_ARN=$(aws ecs list-services \
            --cluster "$ECS_CLUSTER" \
            --region "${AWS_REGION}" \
            --output text \
            --query 'serviceArns[0]')
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "No ECS service found in cluster $ECS_CLUSTER — has VakInfra been deployed yet? Skipping."
            exit 0
          fi
          SERVICE="${SERVICE_ARN##*/}"
          echo "Force-deploying service: $SERVICE in cluster: $ECS_CLUSTER"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$SERVICE" \
            --region "${AWS_REGION}" \
            --force-new-deployment \
            --query 'service.{status:status,running:runningCount,pending:pendingCount}'
