name: Build, Push & Deploy

# Push to main → builds image, deploys to all stages (alpha, beta, prod).
# Push to alpha → deploys to alpha, promotes to beta + prod.
# Push to beta  → deploys to beta, promotes to prod.
# Push to prod  → deploys to prod only.
#
# Required secrets: AWS_ROLE_ARN (already set)

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to all stages (main push)
        if: github.ref_name == 'main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build once, tag and push for all stages
          docker build -t vak-deepgram .
          for STAGE in alpha beta prod; do
            IMAGE=$ECR_REGISTRY/vak-deepgram:$STAGE
            docker tag vak-deepgram $IMAGE
            docker push $IMAGE
            echo "Pushed $IMAGE"
            CLUSTER="vak-cluster-$STAGE"
            SERVICE=$(aws ecs list-services --cluster $CLUSTER --region us-west-2 \
              --query 'serviceArns[0]' --output text | xargs basename)
            aws ecs update-service --cluster $CLUSTER --service $SERVICE \
              --force-new-deployment --region us-west-2
            echo "Deployed $CLUSTER/$SERVICE"
          done
          # Promote main → alpha → beta → prod
          for BRANCH in alpha beta prod; do
            git checkout $BRANCH
            git merge --ff-only origin/main
            git push origin $BRANCH
          done

      - name: Deploy to alpha + promote (alpha push)
        if: github.ref_name == 'alpha'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t vak-deepgram .
          for STAGE in alpha beta prod; do
            IMAGE=$ECR_REGISTRY/vak-deepgram:$STAGE
            docker tag vak-deepgram $IMAGE
            docker push $IMAGE
            CLUSTER="vak-cluster-$STAGE"
            SERVICE=$(aws ecs list-services --cluster $CLUSTER --region us-west-2 \
              --query 'serviceArns[0]' --output text | xargs basename)
            aws ecs update-service --cluster $CLUSTER --service $SERVICE \
              --force-new-deployment --region us-west-2
            echo "Deployed $CLUSTER/$SERVICE"
          done
          git checkout beta && git merge --ff-only origin/alpha && git push origin beta
          git checkout prod && git merge --ff-only origin/alpha && git push origin prod

      - name: Deploy to beta + promote (beta push)
        if: github.ref_name == 'beta'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t vak-deepgram .
          for STAGE in beta prod; do
            IMAGE=$ECR_REGISTRY/vak-deepgram:$STAGE
            docker tag vak-deepgram $IMAGE
            docker push $IMAGE
            CLUSTER="vak-cluster-$STAGE"
            SERVICE=$(aws ecs list-services --cluster $CLUSTER --region us-west-2 \
              --query 'serviceArns[0]' --output text | xargs basename)
            aws ecs update-service --cluster $CLUSTER --service $SERVICE \
              --force-new-deployment --region us-west-2
            echo "Deployed $CLUSTER/$SERVICE"
          done
          git checkout prod && git merge --ff-only origin/beta && git push origin prod

      - name: Deploy to prod (prod push)
        if: github.ref_name == 'prod'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$ECR_REGISTRY/vak-deepgram:prod
          docker build -t $IMAGE .
          docker push $IMAGE
          CLUSTER="vak-cluster-prod"
          SERVICE=$(aws ecs list-services --cluster $CLUSTER --region us-west-2 \
            --query 'serviceArns[0]' --output text | xargs basename)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE \
            --force-new-deployment --region us-west-2
          echo "Deployed $CLUSTER/$SERVICE"
